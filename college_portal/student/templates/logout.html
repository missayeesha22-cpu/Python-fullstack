
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3a8a, #7c3aed);
        }

        .logout-box {
            width: 360px;
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }

        h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            background: #1e3a8a;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #7c3aed;
        }
    </style>
</head>

<body>

    <div class="logout-box">

        <h2>Logged Out Successfully!</h2>

        <p>
            You have successfully logged out
            from the Student Management System.
        </p>

        <a href="{% url 'login' %}">
            Login Again
        </a>

    </div>

</body>
</html>
